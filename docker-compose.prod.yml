services:
  postgres:
    image: postgres:16-alpine
    container_name: funmotionlabs-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-funmotionlabs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - funmotionlabs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./packages/Frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: funmotionlabs-frontend-prod
    ports:
      - "80:80"
    env_file:
      - .env
    networks:
      - funmotionlabs-network
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./packages/server
      dockerfile: Dockerfile.prod
    container_name: funmotionlabs-backend-prod
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-funmotionlabs}
    networks:
      - funmotionlabs-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data_prod:

networks:
  funmotionlabs-network:
    driver: bridge
