options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _AR_REPO: funmotionlabs
  _IMAGE_NAME: funmotionlabs
  _PROD_SERVICE: funmotionlabs
  _SERVICE_PREFIX: funmotion
  _CLOUDSQL_INSTANCE: PROJECT_ID:REGION:INSTANCE
  _RUN_SA: funmotionlabs-run@PROJECT_ID.iam.gserviceaccount.com
  _DATABASE_URL_SECRET: funmotionlabs-database-url

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.prod
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        RAW_BRANCH="${BRANCH_NAME:-manual}"
        SAFE_BRANCH="$(echo "$$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9-]#-#g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-40)"
        if [ -z "$$SAFE_BRANCH" ]; then SAFE_BRANCH="preview"; fi

        if [ "$$RAW_BRANCH" = "main" ] || [ "$$RAW_BRANCH" = "master" ] || [ "$$RAW_BRANCH" = "v2-develop" ]; then
          SERVICE_NAME="${_PROD_SERVICE}"
        else
          SERVICE_NAME="${_SERVICE_PREFIX}-$$SAFE_BRANCH"
        fi

        IMAGE_URI="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA"

        gcloud run deploy "$$SERVICE_NAME" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --platform=managed \
          --image="$$IMAGE_URI" \
          --service-account="${_RUN_SA}" \
          --allow-unauthenticated \
          --port=8080 \
          --concurrency=80 \
          --min-instances=0 \
          --max-instances=3 \
          --cpu=1 \
          --memory=512Mi \
          --timeout=300 \
          --add-cloudsql-instances="${_CLOUDSQL_INSTANCE}" \
          --set-env-vars="NODE_ENV=production,FRONTEND_DIST=/app/packages/Frontend/dist" \
          --set-secrets="DATABASE_URL=${_DATABASE_URL_SECRET}:latest"

        gcloud run services describe "$$SERVICE_NAME" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --format='value(status.url)'

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$SHORT_SHA
