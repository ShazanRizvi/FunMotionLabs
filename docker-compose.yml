services:
  postgres:
    image: postgres:16-alpine
    container_name: funmotionlabs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-funmotionlabs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - funmotionlabs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./packages/Frontend
      dockerfile: Dockerfile
    container_name: funmotionlabs-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./packages/Frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
    networks:
      - funmotionlabs-network
    depends_on:
      - backend
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: funmotionlabs-backend
    ports:
      - "3001:3001"
    volumes:
      - ./packages/server:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3001}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-funmotionlabs}
    networks:
      - funmotionlabs-network
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:

networks:
  funmotionlabs-network:
    driver: bridge
