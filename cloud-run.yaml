apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: funmotionlabs
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE
    spec:
      serviceAccountName: funmotionlabs-run@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/funmotionlabs/funmotionlabs:TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: FRONTEND_DIST
              value: /app/packages/Frontend/dist
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: funmotionlabs-database-url
                  key: latest
